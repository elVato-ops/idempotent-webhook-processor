name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: webhooks
          POSTGRES_USER: webhooks
          POSTGRES_PASSWORD: webhooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhooks -d webhooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: webhooks
      DB_USER: webhooks
      DB_PASSWORD: webhooks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
